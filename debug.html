            <button @click.prevent="window.player.currentTime += 600" type="button"
                class="relative -ml-px inline-flex items-center rounded-r-md bg-transparent pl-3 pr-2 py-2 text-xs font-semibold text-white ring-1 ring-inset ring-white hover:bg-primary focus:z-10">
                10m
                <svg class="w-4 h-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                    <path fill-rule="evenodd"
                        d="M10.21 14.77a.75.75 0 01.02-1.06L14.168 10 10.23 6.29a.75.75 0 111.04-1.08l4.5 4.25a.75.75 0 010 1.08l-4.5 4.25a.75.75 0 01-1.06-.02z"
                        clip-rule="evenodd"></path>
                    <path fill-rule="evenodd"
                        d="M4.21 14.77a.75.75 0 01.02-1.06L8.168 10 4.23 6.29a.75.75 0 111.04-1.08l4.5 4.25a.75.75 0 010 1.08l-4.5 4.25a.75.75 0 01-1.06-.02z"
                        clip-rule="evenodd"></path>
                </svg>
            </button>
        </span>
    </div>
    <div class="-mx-4 sm:m-0 px-4 py-2 sm:py-4 bg-black rounded-b-0 sm:rounded-b-lg">
        <div class="flex items-center flex-nowrap leading-5">
            <div class="grow">
                <label for="clip-start-time" class="hidden">Start from</label>
                <input x-model="clipStartTime" type="text" placeholder="00:00:00" id="clip-start-time"
                    class="text-right w-18 sm:w-20 p-0 border-0 border-b border-gray-300 text-sm sm:text-base text-gray-300 font-mono bg-transparent focus:border-transparent focus:ring-0">
                <a @click.prevent="copyCurrentTime('clipStartTime')" href="#">
                    <svg xmlns="http://www.w3.org/2000/svg" class="inline h-4 w-4 sm:h-5 sm:w-5 text-nord13"
                        viewBox="0 0 20 20" fill="currentColor">
                        <path d="M8 3a1 1 0 011-1h2a1 1 0 110 2H9a1 1 0 01-1-1z"></path>
                        <path
                            d="M6 3a2 2 0 00-2 2v11a2 2 0 002 2h8a2 2 0 002-2V5a2 2 0 00-2-2 3 3 0 01-3 3H9a3 3 0 01-3-3z">
                        </path>
                    </svg>
                </a>
                <svg xmlns="http://www.w3.org/2000/svg" class="inline mx-0 sm:mx-1 h-3 w-3 xs:h-5 xs:w-5 text-gray-300"
                    viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd"
                        d="M10.293 15.707a1 1 0 010-1.414L14.586 10l-4.293-4.293a1 1 0 111.414-1.414l5 5a1 1 0 010 1.414l-5 5a1 1 0 01-1.414 0z"
                        clip-rule="evenodd"></path>
                    <path fill-rule="evenodd"
                        d="M4.293 15.707a1 1 0 010-1.414L8.586 10 4.293 5.707a1 1 0 011.414-1.414l5 5a1 1 0 010 1.414l-5 5a1 1 0 01-1.414 0z"
                        clip-rule="evenodd"></path>
                </svg>
                <label for="clip-end-time" class="hidden">Loop to</label>
                <input x-model="clipEndTime" type="text" placeholder="00:00:00" id="clip-end-time"
                    class="text-right w-18 sm:w-20 p-0 border-0 border-b border-gray-300 text-sm sm:text-base text-gray-300 font-mono bg-transparent focus:border-transparent focus:ring-0">
                <a @click.prevent="copyCurrentTime('clipEndTime')" href="#">
                    <svg xmlns="http://www.w3.org/2000/svg" class="inline h-4 w-4 sm:h-5 sm:w-5 text-nord13"
                        viewBox="0 0 20 20" fill="currentColor">
                        <path d="M8 3a1 1 0 011-1h2a1 1 0 110 2H9a1 1 0 01-1-1z"></path>
                        <path
                            d="M6 3a2 2 0 00-2 2v11a2 2 0 002 2h8a2 2 0 002-2V5a2 2 0 00-2-2 3 3 0 01-3 3H9a3 3 0 01-3-3z">
                        </path>
                    </svg>
                </a>
            </div>
            <div class="sm:ml-6">
                <button :class="{
                    'bg-primary': isLooping,
                    'hover:bg-opacity-75': isLooping,
                    'active:bg-nord3': isLooping,
                    'border-1': ! isLooping,
                    'border-white': ! isLooping,
                }" @click.prevent="isLooping = ! isLooping" type="button"
                    class="inline-flex items-center whitespace-nowrap px-2.5 py-1.5 border border-transparent text-xs font-medium rounded shadow-sm text-white border-1 border-white">
                    Looping
                    <svg :class="{
                        'text-emerald-400': isLooping,
                        'text-red-500': ! isLooping,
                    }" class="ml-1.5 h-2 w-2 text-red-500" fill="currentColor" viewBox="0 0 8 8">
                        <circle cx="4" cy="4" r="3"></circle>
                    </svg>
                </button>
            </div>
        </div>
    </div>
